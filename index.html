<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bible Side by Side</title>
<style id="page-style">@page { size: letter portrait; margin: 14mm 12mm 16mm; }</style>
<style>
:root {
  --bg: #f7f4ee; --panel: #fffdf9; --ink: #1f1c18; --muted: #6d665c;
  --line: #e2dbcf; --accent: #7a4b1f; --accent-ink: #fff; --warn-bg: #fbeee4; --warn: #a3471f;
  --rule: #c5ced9; --fs: 11pt;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1b1916; --panel: #24211d; --ink: #ece6dc; --muted: #a39b8f;
    --line: #3a352e; --accent: #d39a5c; --accent-ink: #1b1916; --warn-bg: #3a2a20; --warn: #f0a77a;
    --rule: #39414b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

header.app { padding: 28px 0 8px; }
header.app h1 { font: 400 28px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 4px; }
header.app p { margin: 0; color: var(--muted); }

.inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 0; }
.side { display: flex; flex-direction: column; gap: 8px; }
.side input, .doc-title input {
  font: 600 15px/1.4 inherit; font-family: inherit; padding: 8px 10px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--panel); color: var(--ink); }
.side textarea {
  height: 240px; resize: vertical; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); font: 14px/1.45 Georgia, serif; }
.side .count { font-size: 13px; color: var(--muted); min-height: 1.3em; }
.side select, .passage select { font: inherit; font-size: 14px; padding: 7px 8px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.side .picked { padding: 14px; display: flex; align-items: center; justify-content: center; text-align: center;
  border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 14px; }
.passage { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 0 0 16px; }
.passage label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
[hidden] { display: none !important; }
.doc-title { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.doc-title label, .side label { font-size: 13px; color: var(--muted); }

.toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 10px 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.toolbar label { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.toolbar select { font: inherit; font-size: 14px; padding: 4px 6px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.toolbar .spacer { flex: 1; }
button { font: inherit; font-size: 14px; padding: 8px 14px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.status { font-size: 13px; color: var(--muted); padding: 10px 0 0; }
.status .warn { color: var(--warn); }

/* ---------- the side-by-side document ---------- */
#doc { padding: 16px 0 60px; }
#doc .print-title { font: 400 22px/1.25 Georgia, serif; text-align: center; margin: 0 0 12px; }
#doc .print-title:empty { display: none; }
table.parallel { width: 100%; border-collapse: collapse; table-layout: fixed;
  font: var(--fs)/1.45 Georgia, "Times New Roman", serif; background: var(--panel); }
table.parallel col.ref { width: 3.4em; }
table.parallel th { font: 600 calc(var(--fs) * 0.95)/1.3 Georgia, serif; text-align: left;
  padding: 8px 10px; border-bottom: 2px solid var(--ink); }
table.parallel td { vertical-align: top; padding: 4px 10px; border-bottom: 1px solid var(--line); }
table.parallel td.ref { color: var(--muted); font-size: 0.8em; padding-top: 0.45em; text-align: right;
  padding-right: 6px; white-space: nowrap; }
table.parallel td.missing { background: var(--warn-bg); color: var(--warn); font-style: italic; }
table.parallel tr.chapter td { font: 700 calc(var(--fs) * 1.15)/1.3 Georgia, serif; padding: 14px 10px 6px;
  border-bottom: 1px solid var(--ink); }
/* room for handwritten notes */
table.parallel col.notes { width: 32%; }
table.parallel td.notes { border-left: 1px solid var(--line); }
table.parallel.ruled td.notes {
  background-image: linear-gradient(to bottom, transparent calc(100% - 1px), var(--rule) calc(100% - 1px));
  background-size: 100% 2em;
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
table.parallel.space tr:not(.chapter) td { padding-bottom: calc(var(--fs) * 4.5); }
#doc.margins { padding-left: var(--side); padding-right: var(--side); }   /* blank writing space both sides */
#doc.margins table.parallel col.ref { width: 2.6em; }
#doc.margins table.parallel td, #doc.margins table.parallel th { padding-left: 6px; padding-right: 6px; }
#doc.margins table.parallel td.ref { padding-right: 2px; }
table.parallel.no-lines td, table.parallel.no-lines th,
table.parallel.no-lines tr.chapter td { border: none; }
table.parallel.no-refs col.ref { width: 0; }
table.parallel.no-refs td.ref, table.parallel.no-refs th.ref { padding: 0; font-size: 0; }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }

@media (max-width: 700px) {
  .inputs { grid-template-columns: 1fr; }
}

@media print {
  @page { @bottom-center { content: counter(page) " / " counter(pages); font: 9pt Georgia, serif; color: #777; } }
  :root { --ink: #000; --muted: #555; --line: #ccc; --panel: #fff; --warn-bg: #fff; --warn: #777; --rule: #c5ced9; }
  body { background: #fff; }
  .no-print { display: none !important; }
  .wrap { max-width: none; padding: 0; }
  #doc { padding: 0; }
  #doc.margins { padding: 0 var(--side); }
  thead { display: table-header-group; }   /* repeat column titles on every page */
  tr { break-inside: avoid; }
  tr.chapter { break-after: avoid; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="no-print">
    <header class="app">
      <h1>Bible Side by Side</h1>
      <p>Pick two versions (or paste your own), line them up verse by verse, and save as a PDF.</p>
    </header>

    <div class="doc-title">
      <label for="docTitle">Document title (optional, printed at the top)</label>
      <input id="docTitle" placeholder="e.g. Genesis — KJV and BSB">
    </div>

    <div class="inputs">
      <div class="side">
        <label for="srcL">Left version</label>
        <select id="srcL"><option value="paste">Paste my own text</option></select>
        <input id="titleL" placeholder="Column title, e.g. NIV">
        <textarea id="textL" placeholder="Paste the first version here…"></textarea>
        <div class="picked" id="pickedL" hidden></div>
        <div class="count" id="countL"></div>
      </div>
      <div class="side">
        <label for="srcR">Right version</label>
        <select id="srcR"><option value="paste">Paste my own text</option></select>
        <input id="titleR" placeholder="Column title, e.g. ESV">
        <textarea id="textR" placeholder="Paste the second version here…"></textarea>
        <div class="picked" id="pickedR" hidden></div>
        <div class="count" id="countR"></div>
      </div>
    </div>

    <div class="passage" id="passage" hidden>
      <label>Book <select id="book"></select></label>
      <label>Chapters <select id="chFrom"></select></label>
      <label>to <select id="chTo"></select></label>
    </div>

    <div class="toolbar">
      <label>Line up by
        <select id="mode">
          <option value="verse">Verse numbers</option>
          <option value="line">Line / paragraph</option>
        </select>
      </label>
      <label><input type="checkbox" id="showRefs" checked> Verse numbers</label>
      <label>Text size
        <select id="fontSize">
          <option>9</option><option>10</option><option selected>11</option><option>12</option><option>13</option><option>14</option>
        </select>
      </label>
      <label>Writing space
        <select id="notes">
          <option value="none">None</option>
          <option value="margins">Blank margins left and right</option>
          <option value="column">Notes column on the right</option>
        </select>
      </label>
      <label id="marginWidthLabel">Each margin
        <select id="marginWidth">
          <option value="20">⅕ of the page</option>
          <option value="25">¼ of the page</option>
          <option value="33.33" selected>⅓ of the page</option>
        </select>
      </label>
      <label id="ruledLabel"><input type="checkbox" id="ruled"> Ruled notes column</label>
      <label><input type="checkbox" id="spaceUnder"> Space under each verse</label>
      <label><input type="checkbox" id="lines" checked> Lines between verses</label>
      <label>Paper
        <select id="paper"><option value="letter">Letter</option><option value="A4">A4</option><option value="ipad">iPad (fills the screen)</option></select>
      </label>
      <label>Orientation
        <select id="orient"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select>
      </label>
      <span class="spacer"></span>
      <button id="sample" type="button">Try a sample</button>
      <button id="exportPdf" class="primary" type="button">Export PDF</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div id="doc">
    <h2 class="print-title" id="printTitle"></h2>
    <div id="out"><p class="empty no-print">Paste text into both boxes and the side-by-side view appears here.</p></div>
  </div>
</div>

<script>
// ---------------------------------------------------------------------------
// Verse detection
//
// Pasted Bible text comes in many shapes:
//   "Genesis 1" heading lines, then "1 In the beginning…" one verse per line
//   one long paragraph with inline numbers: "…the earth. 2 And the earth…"
//   explicit references: "Genesis 1:1 In the beginning…" or "1:1 In the…"
//   numbers glued to the word, copied from superscripts: "1In the beginning"
//
// A plain number is only accepted as a verse marker when it is the verse we
// expect next (or close to it at the start of a line), so numbers inside the
// text ("three hundred and 3 days") are almost never mistaken for verses.
// ---------------------------------------------------------------------------

// Text copied from Bible websites (Bible Gateway, YouVersion…) carries extras:
// footnote/cross-reference markers, section headings, "Read full chapter",
// then footnotes, the version name and copyright text after the passage.
const NOISE_RE = /\[[a-z]{1,2}\]|\([A-Z]{1,2}\)|\b(?:Read full chapter|Leer (?:el )?cap[ií]tulo completo)\b/g;
const STOP_RE = /^(?:footnotes|cross references|notas al pie|notas|referencias cruzadas|read full chapter|leer (?:el )?cap[ií]tulo completo|copyright|©)/i;
const VERSION_LINE_RE = /^[^:]{3,60}?\s\(([A-Z][A-Z0-9-]{1,9})\)$/;                          // "Reina-Valera 1960 (RVR1960)"
const REF_LINE_RE = /^(?:[1-3] ?)?\p{L}[\p{L} .']*?\s+(\d{1,3}):\d{1,3}(?:\s*[-–]\s*\d{1,3})?(?:\s+\(?([A-Z][A-Z0-9-]{1,9})\)?)?$/u;  // "Juan 3:1-16 RVR1960"
const HEADING_RE = /^((?:[1-3] ?)?\p{L}[\p{L} .']{0,28}?)\s+(\d{1,3})(?:\s*[-–]\s*\d{1,3})?$/u;  // "Génesis 2", "Psalm 23", "Génesis 1-2"
const MARKER_RE = /(?:((?:[1-3] ?)?\p{Lu}\p{Ll}+\.?) )?(\d{1,3}):(\d{1,3})(?!\d)|(?<![\p{L}\p{N}_:,\-–])(\d{1,3})(?=[  ]?[^\s\d,.:;)\-–—%])/gu;
const VERSE_START_RE = /^[  ]?["'“‘(\[«¿¡]*\p{Lu}/u;
const SENTENCE_END_RE = /[.!?"'”’»)\]]\s*$/;
const PUNCT_END_RE = /[.,;:!?"'”’»)\]]\s*$/;

const normBook = s => s.toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g, '').replace(/s$/, '');

function parseVerses(text) {
  const verses = new Map();      // "b|c|v" -> { b, c, v, text }
  const books = [];              // book index -> name as written
  let b = 0, bookNorm = null, c = 1, v = 0, cur = null;
  let chapterKnown = false;      // false = the text never said which chapter it is
  let version = '';              // e.g. "RVR1960", if the pasted text names it

  const setBook = name => {
    const n = normBook(name);
    if (n === 'chapter' || n === 'capitulo' || n === bookNorm) return;
    if (bookNorm !== null || verses.size) b++;
    bookNorm = n;
    books[b] = name.trim();
  };
  const start = (nc, nv) => {
    c = nc; v = nv;
    const key = b + '|' + c + '|' + v;
    cur = verses.get(key) || { b, c, v, text: '' };
    verses.set(key, cur);
  };
  const add = s => {
    s = s.replace(/\s+/g, ' ').trim();
    if (cur && s) cur.text = cur.text ? cur.text + ' ' + s : s;
  };

  const lines = text.replace(NOISE_RE, '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);

  // The version's name and a "Juan 3:16-17 RVR1960" style reference can sit
  // anywhere, often after the passage, so look for them first
  let refChapter = 0;
  for (const line of lines) {
    const ref = line.match(REF_LINE_RE), ver = line.match(VERSION_LINE_RE);
    if (ref && !refChapter) refChapter = +ref[1];
    if (!version) version = (ref && ref[2]) || (ver && ver[1]) || '';
  }

  // The first number followed by words after position `pos` of line `i`
  const nextNumber = (i, pos) => {
    const rest = (lines[i].slice(pos) + ' ' + lines.slice(i + 1, i + 4).join(' '));
    const m = rest.match(/(?:^|[\s.,;:!?"'”’»)\]])(\d{1,3})[  ]?["'“‘(\[«¿¡]*\p{L}/u);
    return m ? +m[1] : null;
  };

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // What follows the passage: footnotes, copyright, the version's name
    if (STOP_RE.test(line)) { if (verses.size) break; continue; }
    if (VERSION_LINE_RE.test(line)) { if (verses.size) break; continue; }
    if (REF_LINE_RE.test(line)) continue;

    // "Génesis 2", "Chapter 2", "Psalm 23" on a line of their own
    const h = line.match(HEADING_RE);
    if (h && +h[2] <= 150 && !/[.,;:!?]$/.test(h[1])) {
      setBook(h[1]); c = +h[2]; v = 0; cur = null; chapterKnown = true;
      continue;
    }
    // A bare number on its own line: the next verse, or a chapter number
    // (two bare numbers in a row = chapter number, then verse number)
    if (/^\d{1,3}$/.test(line)) {
      const n = +line;
      const nextIsNumber = /^\d{1,3}$/.test(lines[i + 1] || '');
      if (nextIsNumber) { c = n; v = 0; cur = null; chapterKnown = true; }
      else if (n > v && (v === 0 || n <= v + 3)) start(c, n);
      else if (n === 1 && v > 1) start(c + 1, 1);
      else { c = n; v = 0; cur = null; chapterKnown = true; }
      continue;
    }
    // A section heading ("Jesús y Nicodemo"): short, no closing punctuation,
    // and the next line starts with a verse number
    if (!/^\d/.test(line) && !/^\d{1,3}$/.test(lines[i - 1] || '') && line.length <= 80 && !PUNCT_END_RE.test(line) && /^\d/.test(lines[i + 1] || '')) {
      continue;
    }

    let last = 0, m;
    MARKER_RE.lastIndex = 0;
    while ((m = MARKER_RE.exec(line))) {
      let nc, nv;
      if (m[2]) {                                  // explicit 1:1
        nc = +m[2]; nv = +m[3];
        if (m[1] && !/^(and|the|then|but|for|in|chapter|y|el|la|en|cap[ií]tulo)$/i.test(m[1])) setBook(m[1]);
        chapterKnown = true;
      } else {                                     // plain number
        const n = +m[4];
        const atStart = m.index === 0;
        const before = line.slice(0, m.index);
        const afterSentence = SENTENCE_END_RE.test(before);
        // mid-line, a verse number follows punctuation or starts a capitalised
        // word, so "and 3 days" is not taken as verse 3
        const looksLikeVerse = atStart || PUNCT_END_RE.test(before) || VERSE_START_RE.test(line.slice(m.index + m[4].length));
        const chapterStart = (atStart || afterSentence) && looksLikeVerse;
        if (v === 0 && n > 1 && looksLikeVerse && nextNumber(i, m.index + m[0].length) === 2) {
          // Bible Gateway prints the chapter number where verse 1 would be
          nc = n; nv = 1; chapterKnown = true;
        }
        else if (n === v + 1 && looksLikeVerse) { nc = c; nv = n; }
        else if (atStart && n > v && (v === 0 || n <= v + 3)) { nc = c; nv = n; }
        else if (n === 1 && v > 1 && chapterStart) { nc = c + 1; nv = 1; }
        else if (n === c + 1 && v > 1 && chapterStart && nextNumber(i, m.index + m[0].length) === 2) { nc = n; nv = 1; }
        else continue;
      }
      add(line.slice(last, m.index));
      start(nc, nv);
      last = m.index + m[0].length;
    }
    add(line.slice(last));
  }
  const result = { verses, books, chapterKnown, version };
  // Only a reference line said which chapter this is
  return !chapterKnown && refChapter ? { ...shiftChapters(result, refChapter), chapterKnown: true } : result;
}

// Pasted text that never says its chapter starts at "chapter 1". When the other
// side is a chosen passage, move it to that passage's chapters so they line up.
function shiftChapters(P, firstChapter) {
  if (P.chapterKnown || firstChapter === 1) return P;
  const verses = new Map();
  for (const x of P.verses.values()) {
    const y = { ...x, c: x.c + firstChapter - 1 };
    verses.set(y.b + '|' + y.c + '|' + y.v, y);
  }
  return { ...P, verses };
}

function parseLines(text) {
  // Blank lines separate paragraphs; if there are none, each line is a row.
  const t = text.trim();
  if (!t) return [];
  const parts = /\n\s*\n/.test(t) ? t.split(/\n\s*\n/) : t.split(/\n/);
  return parts.map(p => p.replace(/\s+/g, ' ').trim()).filter(Boolean);
}

// ---------------------------------------------------------------------------
// Bible library (public-domain versions stored next to this page in data/)
// ---------------------------------------------------------------------------

const BOOKS = ['Genesis', 'Exodus', 'Leviticus', 'Numbers', 'Deuteronomy', 'Joshua', 'Judges', 'Ruth',
  '1 Samuel', '2 Samuel', '1 Kings', '2 Kings', '1 Chronicles', '2 Chronicles', 'Ezra', 'Nehemiah', 'Esther',
  'Job', 'Psalms', 'Proverbs', 'Ecclesiastes', 'Song of Solomon', 'Isaiah', 'Jeremiah', 'Lamentations',
  'Ezekiel', 'Daniel', 'Hosea', 'Joel', 'Amos', 'Obadiah', 'Jonah', 'Micah', 'Nahum', 'Habakkuk',
  'Zephaniah', 'Haggai', 'Zechariah', 'Malachi', 'Matthew', 'Mark', 'Luke', 'John', 'Acts', 'Romans',
  '1 Corinthians', '2 Corinthians', 'Galatians', 'Ephesians', 'Philippians', 'Colossians',
  '1 Thessalonians', '2 Thessalonians', '1 Timothy', '2 Timothy', 'Titus', 'Philemon', 'Hebrews', 'James',
  '1 Peter', '2 Peter', '1 John', '2 John', '3 John', 'Jude', 'Revelation'];

let versions = [];                 // from data/versions.json
const bookCache = new Map();       // "kjv/43" -> promise of [[verse, …], …]

function loadBook(vid, book) {
  const key = vid + '/' + book;
  if (!bookCache.has(key)) {
    const p = fetch('data/' + key + '.json').then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
    p.catch(() => bookCache.delete(key));   // let a failed download be retried
    bookCache.set(key, p);
  }
  return bookCache.get(key);
}

// Same shape as parseVerses() so pasted and library text line up the same way
async function libraryPassage(vid) {
  const book = +$('book').value, from = +$('chFrom').value, to = +$('chTo').value;
  const chapters = await loadBook(vid, book);
  const verses = new Map();
  for (let c = from; c <= to; c++) {
    (chapters[c - 1] || []).forEach((text, i) => {
      if (text) verses.set('0|' + c + '|' + (i + 1), { b: 0, c, v: i + 1, text });
    });
  }
  return { verses, books: [BOOKS[book - 1]] };
}

const versionOf = id => versions.find(v => v.id === id);

function fillChapters() {
  const vid = [$('srcL').value, $('srcR').value].find(versionOf);
  const count = vid ? versionOf(vid).chapters[+$('book').value - 1] : 1;
  for (const sel of [$('chFrom'), $('chTo')]) {
    const keep = +sel.value;
    sel.innerHTML = Array.from({ length: count }, (_, i) => '<option>' + (i + 1) + '</option>').join('');
    sel.value = String(Math.min(keep || 1, count));
  }
  if (+$('chTo').value < +$('chFrom').value) $('chTo').value = $('chFrom').value;
}

function passageLabel() {
  const book = BOOKS[+$('book').value - 1], from = $('chFrom').value, to = $('chTo').value;
  return book + ' ' + (from === to ? from : from + '–' + to);
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const fmt = n => n.toLocaleString();

let notesCol = false;   // set by render(); adds an empty column for handwriting
const detected = { L: '', R: '' };   // version named inside pasted text, e.g. "RVR1960"

function cell(text) {
  return text ? '<td>' + esc(text) + '</td>' : '<td class="missing">—</td>';
}
const notesCell = () => notesCol ? '<td class="notes"></td>' : '';

function columnTitle(side) {
  const typed = $('title' + side).value.trim();
  const v = versionOf($('src' + side).value);
  return typed || (v ? v.name : detected[side] || (side === 'L' ? 'Left' : 'Right'));
}

function header() {
  return '<thead><tr><th class="ref"></th><th>' + esc(columnTitle('L')) + '</th><th>' + esc(columnTitle('R')) +
    '</th>' + (notesCol ? '<th>Notes</th>' : '') + '</tr></thead>';
}

function renderVerses(L, R) {
  const keys = new Set([...L.verses.keys(), ...R.verses.keys()]);
  const sorted = [...keys].map(k => k.split('|').map(Number)).sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  const span = notesCol ? 4 : 3;

  let html = '', prevChapter = null, missing = 0;
  for (const [b, c, v] of sorted) {
    const key = b + '|' + c + '|' + v;
    if (b + '|' + c !== prevChapter) {
      const book = L.books[b] || R.books[b];
      html += '<tr class="chapter"><td colspan="' + span + '">' + esc(book ? book + ' ' + c : 'Chapter ' + c) + '</td></tr>';
      prevChapter = b + '|' + c;
    }
    const l = L.verses.get(key), r = R.verses.get(key);
    if (!l || !r) missing++;
    html += '<tr><td class="ref">' + c + ':' + v + '</td>' + cell(l && l.text) + cell(r && r.text) + notesCell() + '</tr>';
  }
  return { html, rows: sorted.length, missing };
}

function renderLines(L, R) {
  const n = Math.max(L.length, R.length);
  let html = '';
  for (let i = 0; i < n; i++) {
    html += '<tr><td class="ref">' + (i + 1) + '</td>' + cell(L[i]) + cell(R[i]) + notesCell() + '</tr>';
  }
  return { html, rows: n, missing: Math.abs(L.length - R.length) };
}

function updateSides() {
  let anyLibrary = false;
  for (const side of ['L', 'R']) {
    const v = versionOf($('src' + side).value);
    anyLibrary = anyLibrary || !!v;
    $('text' + side).hidden = !!v;
    $('picked' + side).hidden = !v;
    if (v) $('picked' + side).textContent = v.name + ' · ' + v.lang;
    $('title' + side).placeholder = v ? 'Column title (default: ' + v.name + ')' : 'Column title, e.g. ' + (side === 'L' ? 'NIV' : 'ESV');
  }
  $('passage').hidden = !anyLibrary;
  $('mode').disabled = anyLibrary;   // library text always lines up by verse
  $('ruledLabel').hidden = $('notes').value !== 'column';
  $('marginWidthLabel').hidden = $('notes').value !== 'margins';
}

let renderId = 0;
async function render() {
  const id = ++renderId;
  const status = $('status');
  updateSides();

  const libL = versionOf($('srcL').value), libR = versionOf($('srcR').value);
  const tL = $('textL').value, tR = $('textR').value;
  const hasL = libL || tL.trim(), hasR = libR || tR.trim();
  const mode = libL || libR ? 'verse' : $('mode').value;
  const notes = $('notes').value;
  notesCol = notes === 'column';
  $('doc').classList.toggle('margins', notes === 'margins');
  $('doc').style.setProperty('--side', $('marginWidth').value + '%');

  const title = $('docTitle').value.trim() || (libL || libR ? passageLabel() : '');
  $('printTitle').textContent = title;
  document.title = title || 'Bible Side by Side';

  if (!hasL && !hasR) {
    $('out').innerHTML = '<p class="empty no-print">Choose a version or paste text on each side and the side-by-side view appears here.</p>';
    $('countL').textContent = $('countR').textContent = status.textContent = '';
    return;
  }

  let result, label, warn = '';
  if (mode === 'verse') {
    let L, R;
    try {
      if (libL || libR) status.textContent = 'Loading ' + passageLabel() + '…';
      [L, R] = await Promise.all([
        libL ? libraryPassage(libL.id) : parseVerses(tL),
        libR ? libraryPassage(libR.id) : parseVerses(tR),
      ]);
    } catch (e) {
      if (id === renderId) status.innerHTML = '<span class="warn">Couldn’t load the Bible text (' + esc(e.message) + '). Check your connection and try again.</span>';
      return;
    }
    if (id !== renderId) return;   // a newer render has started
    detected.L = libL ? '' : L.version;
    detected.R = libR ? '' : R.version;
    if (libL || libR) {
      const from = +$('chFrom').value;
      if (!libL) L = shiftChapters(L, from);
      if (!libR) R = shiftChapters(R, from);
    }
    $('countL').textContent = hasL ? fmt(L.verses.size) + ' verses' + (libL ? '' : ' found') : '';
    $('countR').textContent = hasR ? fmt(R.verses.size) + ' verses' + (libR ? '' : ' found') : '';
    result = renderVerses(L, R);
    label = 'verses';
    if ((!libL && tL.trim() && !L.verses.size) || (!libR && tR.trim() && !R.verses.size)) {
      warn = 'No verse numbers were found in a pasted text. Try “Line up by: Line / paragraph”.';
    }
  } else {
    const L = parseLines(tL), R = parseLines(tR);
    $('countL').textContent = hasL ? fmt(L.length) + ' lines' : '';
    $('countR').textContent = hasR ? fmt(R.length) + ' lines' : '';
    result = renderLines(L, R);
    label = 'rows';
  }

  const classes = ['parallel'];
  if (!$('showRefs').checked) classes.push('no-refs');
  if (notesCol && $('ruled').checked) classes.push('ruled');
  if ($('spaceUnder').checked) classes.push('space');
  if (!$('lines').checked) classes.push('no-lines');
  $('out').innerHTML = '<table class="' + classes.join(' ') + '">' +
    '<colgroup><col class="ref"><col><col>' + (notesCol ? '<col class="notes">' : '') + '</colgroup>' +
    header() + '<tbody>' + result.html + '</tbody></table>';

  status.innerHTML = warn ? '<span class="warn">' + warn + '</span>' :
    fmt(result.rows) + ' ' + label + ' side by side' + (result.missing
      ? ' · <span class="warn">' + fmt(result.missing) + ' only in one version (shaded)</span>'
      : ' · everything matched');
}

const PAPER = { letter: ['8.5in', '11in'], A4: ['210mm', '297mm'], ipad: ['210mm', '280mm'] };   // iPad screens are 4:3
function applyPageStyle() {
  document.documentElement.style.setProperty('--fs', $('fontSize').value + 'pt');
  const [w, h] = PAPER[$('paper').value] || PAPER.letter;
  const size = $('orient').value === 'landscape' ? h + ' ' + w : w + ' ' + h;
  $('page-style').textContent = '@page { size: ' + size + '; margin: 14mm 12mm 16mm; }';
}

// ---------------------------------------------------------------------------
// Remember what was typed (this browser only; nothing is sent anywhere)
// ---------------------------------------------------------------------------

const FIELDS = ['docTitle', 'srcL', 'srcR', 'titleL', 'titleR', 'textL', 'textR', 'book', 'chFrom', 'chTo',
  'mode', 'showRefs', 'fontSize', 'notes', 'marginWidth', 'ruled', 'spaceUnder', 'lines', 'paper', 'orient'];
function save() {
  for (const id of FIELDS) {
    const el = $(id);
    try { localStorage.setItem('bsbs.' + id, el.type === 'checkbox' ? String(el.checked) : el.value); } catch (e) {}
  }
}
function load(ids) {
  for (const id of ids) {
    let v = null;
    try { v = localStorage.getItem('bsbs.' + id); } catch (e) {}
    if (v === null) continue;
    const el = $(id);
    if (el.type === 'checkbox') el.checked = v === 'true'; else el.value = v;
  }
}

let timer;
function scheduleRender() {
  clearTimeout(timer);
  timer = setTimeout(() => { render(); save(); }, 300);
}

for (const id of FIELDS) {
  $(id).addEventListener('input', () => {
    if (id === 'book' || id === 'srcL' || id === 'srcR') fillChapters();
    if (id === 'chFrom' && +$('chTo').value < +$('chFrom').value) $('chTo').value = $('chFrom').value;
    if (id === 'chTo' && +$('chTo').value < +$('chFrom').value) $('chFrom').value = $('chTo').value;
    applyPageStyle();
    scheduleRender();
  });
}

$('exportPdf').addEventListener('click', async () => { await render(); window.print(); });

$('sample').addEventListener('click', () => {
  $('docTitle').value = '';
  $('titleL').value = $('titleR').value = '';
  if (versionOf('kjv') && versionOf('bsb')) {
    $('srcL').value = 'kjv'; $('srcR').value = 'bsb';
    $('book').value = '43'; fillChapters();
    $('chFrom').value = '3'; $('chTo').value = '3';
  } else {
    $('srcL').value = $('srcR').value = 'paste';
    $('textL').value = 'Genesis 1\n1 In the beginning God created the heaven and the earth.\n2 And the earth was without form, and void; and darkness was upon the face of the deep.';
    $('textR').value = 'Genesis 1\n1 In the beginning, God created the heavens and the earth. 2 The earth was formless and empty. Darkness was on the surface of the deep.';
  }
  render(); save();
});

async function start() {
  $('book').innerHTML = BOOKS.map((b, i) => '<option value="' + (i + 1) + '">' + b + '</option>').join('');
  try {
    const r = await fetch('data/versions.json');
    if (r.ok) versions = await r.json();
  } catch (e) { /* opened without the library (e.g. straight from disk): paste still works */ }

  const groups = {};
  for (const v of versions) (groups[v.lang] = groups[v.lang] || []).push(v);
  const opts = Object.entries(groups).map(([lang, vs]) => '<optgroup label="' + esc(lang) + '">' +
    vs.map(v => '<option value="' + v.id + '">' + esc(v.name) + '</option>').join('') + '</optgroup>').join('');
  for (const side of ['L', 'R']) $('src' + side).insertAdjacentHTML('beforeend', opts);

  load(['srcL', 'srcR', 'book']);
  for (const side of ['L', 'R']) if (!$('src' + side).value) $('src' + side).value = 'paste';
  if (!$('book').value) $('book').value = '1';
  fillChapters();
  load(FIELDS.filter(id => !['srcL', 'srcR', 'book'].includes(id)));
  // Older versions had "space" and "both" in the notes menu
  let oldNotes = null;
  try { oldNotes = localStorage.getItem('bsbs.notes'); } catch (e) {}
  if (oldNotes === 'space' || oldNotes === 'both') {
    $('notes').value = oldNotes === 'both' ? 'column' : 'none';
    $('spaceUnder').checked = true;
  }
  for (const side of ['L', 'R']) if (!$('src' + side).value) $('src' + side).value = 'paste';
  fillChapters();

  applyPageStyle();
  render();
}
start();
</script>
